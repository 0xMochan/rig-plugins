[package]
name = "rig-profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A curated, reproducible personal Rig agent composition"

[features]
default = ["tui"]
# Rig's frontend and the renderers installed by its basic plugins are separate.
# Both are needed for the normal welcome, pickers, and tool presentation.
tui = ["rig-basics/tui", "rig-delta/tui", "dep:rig-tui", "dep:rig-tui-scroll", "dep:rig-tui-history", "dep:rig-tui-tools", "dep:rig-tui-loading", "dep:rig-tui-games"]

[dependencies]
rig-harness.workspace = true
rig-basics.workspace = true
rig-native-shell.workspace = true
rig-auto-review.workspace = true
rig-bashkit.workspace = true
rig-monty.workspace = true
rig-xonsh.workspace = true
rig-checkpoint-tasks.workspace = true
rig-conversation.workspace = true
rig-delta.workspace = true
rig-tui = { workspace = true, optional = true }
rig-tui-scroll = { workspace = true, optional = true }
rig-tui-history = { workspace = true, optional = true }
rig-tui-tools = { workspace = true, optional = true }
rig-tui-loading = { workspace = true, optional = true }
rig-tui-games = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[lints]
workspace = true

[dev-dependencies]
bevy_app.workspace = true
tempfile.workspace = true
serde_json.workspace = true
