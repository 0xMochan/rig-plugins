# Trusted user configuration. Project .rig/settings.toml cannot override the
# native_shell or auto_review security tables.
[native_shell]
timeout_secs = 60
# Optional: configure the trusted codex-cli 0.142.0 installation explicitly.
# codex = "/absolute/path/to/codex"

[auto_review]
# Uses Rig's existing ChatGPT subscription login; no second provider integration.
model = "chatgpt/gpt-6.1-sol"
timeout_secs = 30
max_evidence_bytes = 65536
